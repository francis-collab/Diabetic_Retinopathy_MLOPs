services:
  api:
    image: diabetic_retinopathy_mlops-api:latest
    # NO host port mapping – only internal network
    expose:
      - "8000"
    volumes:
      - ./models:/app/models
      - ./data/uploads:/app/data/uploads
      - ./data/retrain_buffer:/app/data/retrain_buffer
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2

  lb:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://lb:80
      - TF_CPP_MIN_LOG_LEVEL=2
    depends_on:
      - lb